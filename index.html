<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه آنلاین</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/HP.jpg" type="image/ico">
</head>
<body>
        <!-- ==========================
    منوی بالا
    ========================== -->
    <header>
        <div class="logo">فروشگاه آنلاین</div>
        <nav>
            <a href="#home">خانه</a>
            <a href="#category">دسته‌بندی</a>
            <a href="#products">محصولات</a>
            <a href="#offer">تخفیف‌ها</a>
            <a href="#about">درباره ما</a>
            <a href="#contact">تماس با ما</a>
        </nav>

            <!-- ==========================
    صفحه اصلی (Hero)
    ========================== -->
    <section id="home" class="hero">
        <div class="overlay">
            <h1>به فروشگاه آنلاین خوش آمدید</h1>
            <p>
                بهترین محصولات با کیفیت عالی و قیمت مناسب در اختیار شما قرار دارد.
            </p>
            <a href="#products" class="btn">
                مشاهده محصولات
            </a>
        </div>
    </section>
 <!-- ==========================
    دسته‌بندی محصولات
    ========================== -->
    <section id="category" class="category">
        <h2>دسته‌بندی محصولات</h2>
        <div class="category-box">
            <div class="cat">
              <img src="images/سامسنگ.jpg" alt="موبایل">
                <h3>موبایل</h3>
            </div>
            <div class="cat">
                <img src="images/HP.jpg" alt="لپتاپ">
                <h3>لپتاپ</h3>
            </div>
            <div class="cat">
                <img src="images/هدفون.jpg" alt="هدفون">
                <h3>هدفون</h3>
            </div>
            <div class="cat">
                 <img src="images/کفش.jpg" alt=">بوت و کفش">
                <h3>بوت و کفش</h3>
            </div>
        </div>
    </section>

    </header>
</body>
</html>
